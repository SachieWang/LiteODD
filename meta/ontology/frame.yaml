# =============================================================================
# 元层通用本体类型 (META-LAYER GENERIC ONTOLOGY FRAME)
# -----------------------------------------------------------------------------
# 这是"方法论 Layer 0"的语义脊柱的【类型】层。只存放任何软件系统都有的
# 通用概念类型与关系类型。严禁出现某个目标项目专属的词(capability-seam、
# turn、session-log 等)——那些是【实例】,必须放在目标项目的对象层,并经
# `instantiateOf` 指回这里的类型。
#
# 读写约定:
#   - 元层:本文件 + /meta/metaschema/ 下的 artifact schema
#   - 对象层:/targets/<project>/ontology/instances.yaml(+ components.yaml)
#   - 连接:instance.instantiateOf -> 本文件的概念类型;
#           artifact.conceptRef   -> 对象层实例;
#           artifact.meta.schemaVersion -> 元层版本化
# =============================================================================

schemaVersion: 1.0

# —— 7 个通用概念类型 ——
# 每个类型带极轻的"典型属性"(instances 可补可省略)。
conceptTypes:
  - id: Assembly
    note: 系统如何被拼出来——组件/模块的组合方式、层叠与配置规则
    attributes: [composedOf, layeredBy, overrideRule]

  - id: Component
    note: 系统被拆解成的单元(包/模块/服务)
    attributes: [name, responsibility]

  - id: Seam
    note: 可替换的"端口-适配器"边界——契约 + 可交换实现 + 消费者
    attributes: [contract, providers, consumers]

  - id: ExecutionUnit
    note: 一段可触发、有边界、有副作用的工作(请求/任务/流程片段)
    attributes: [trigger, boundaryStart, boundaryEnd, sideEffects]

  - id: PersistentState
    note: 必须可重建、可追溯的状态(append-only 日志/快照/持久化数据)
    attributes: [appendOnly, reconstructable, invariants]

  - id: EventStream
    note: 事件的产生/观察/排序(事件驱动系统的广播与分发)
    attributes: [producers, observers, ordering]

  - id: ContextBoundary
    note: 隔离/作用域边界(限界上下文、作用域、权限/可见性裁剪)
    attributes: [isolation, shadowable, restricts]

  - id: Rule
    note: 可版本化、约束其它概念的规则/规程/约束(经 constrains 关系表达约束对象);区别于 PersistentState——Rule 是"必须"而非"被读写的数据"
    attributes: [version, effectiveFrom, appliesTo]

  - id: Actor
    note: 执行或参与执行、受规则约束的人类/角色/组织主体;区别于 ExecutionUnit——Actor 是"谁",ExecutionUnit 是"做什么"
    attributes: [role, orgUnit]

# —— 通用关系类型(8 条)——
# 每条带:description(一句话含义)与 direction(方向约定)。
# direction 统一写 subject→object:domain-model 的 relationships[].from 即 subject、
# .to 即 object;换一个作者也能写出同向的表达(G1 的缺口就是这里没约定)。
relationTypes:
  - id: composes
    description: 整体由部分组成;subject 为整体,object 为其组成部分
    direction: 整体 → 部分
  - id: providedBy
    description: 能力/服务由其实现方提供;subject 为被提供的能力或接口,object 为提供它的实现
    direction: 能力/接口 → 实现方
  - id: usedBy
    description: 某物被使用者消费;subject 为被使用物,object 为使用者
    direction: 被使用物 → 使用者
  - id: triggers
    description: 触发一次执行或一个事件;subject 为触发源,object 为被触发的执行单元/事件
    direction: 触发源 → 被触发者
  - id: writes
    description: 向持久态写入;subject 为执行单元/事件,object 为被写入的持久态
    direction: 写入者 → 被写入的持久态
  - id: reads
    description: 从持久态读取;subject 为执行单元/事件,object 为被读取的持久态
    direction: 读取者 → 被读取的持久态
  - id: dependsOn
    description: 依赖另一个概念(功能性或前置性);subject 为依赖方,object 为被依赖方
    direction: 依赖方 → 被依赖方
  - id: constrains
    description: 约束其它概念的可取行为(如规程约束工单);subject 为约束,object 为被约束者
    direction: 约束 → 被约束者

# —— 类型/实例分离规则(元层治理对象层的两个抓手之一)——
separation:
  rule: "类型在元层,实例在对象层;实例必须通过 instantiateOf 指回此处的类型。"
  link: instantiateOf   # 类型 -> 实例 的元/对象映射键
