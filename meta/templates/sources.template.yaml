# =============================================================================
# 对象层模板 —— ontology/sources.yaml  (复制到 targets/<project>/ontology/)
# -----------------------------------------------------------------------------
# 来源注册表。需求条目的 source 必须是 `file:<存在的相对路径>` 或下列已登记 id
# (由闸门规则 provenance_resolvable 确定性校验)。
# 对"没有文件"的来源(会话/愿景),在此显式登记并说明,杜绝伪溯源。
# 本模板为通用模板,不含任何具体目标内容。
# =============================================================================

schemaVersion: 1.0

sources:
  - id: "<source-id>"
    kind: "<session | doc | vision | ...>"
    ref: "<会话 id 或 URL;可为空字符串>"
    note: "<来源说明;若无对应文件,写清原因>"
