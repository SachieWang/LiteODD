# =============================================================================
# 对象层模板 —— ontology/components.yaml  (复制到 targets/<project>/ontology/)
# -----------------------------------------------------------------------------
# 组件薄索引。每个组件的 **ref 是唯一必填**,且必须解析到 instances.yaml 中的
# 某个实例 id(由闸门规则 realm_structure 确定性校验)。
#
# path 可选:软件领域填代码路径(如 packages/<group> 或 src/<module>);
# 非软件领域(制造/医疗/物流等)没有代码路径——可填**逻辑归属定位符**
# (如 shopfloor/line-a),也可直接省略,不影响合规。
# 本模板为通用模板,不含任何具体目标内容。
# =============================================================================

schemaVersion: 1.0

components:
  - name: "<组件/包组名>"
    path: "<可选:代码路径或逻辑定位符;非软件领域可省略>"
    ref: "sp:<instance-id>"
    note: "<该组件对应的本体实例>"
