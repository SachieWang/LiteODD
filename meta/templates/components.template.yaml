# =============================================================================
# 对象层模板 —— ontology/components.yaml  (复制到 targets/<project>/ontology/)
# -----------------------------------------------------------------------------
# 组件薄索引。每个组件的 ref 必须解析到 instances.yaml 中的某个实例 id
# (由闸门规则 realm_structure 确定性校验)。
# 本模板为通用模板,不含任何具体目标内容。
# =============================================================================

schemaVersion: 1.0

components:
  - name: "<组件/包组名>"
    path: "<代码路径,如 packages/<group> 或 src/<module>>"
    ref: "sp:<instance-id>"
    note: "<该组件对应的本体实例>"
